backend:
  name: github
  repo: mindsfire/mdpva-website
  branch: main
  base_url: https://mdpva-cms-auth.sandeshparjanya.workers.dev

site_url: https://mdpva.org
logo_url: https://mdpva.org/uploads/mdpva-logo.png

publish_mode: simple
media_folder: "public/uploads"
public_folder: "/uploads"

# Upload guardrails: images are auto-converted to WebP and downscaled to fit
# 1600px; anything still over 1 MB after transformation is rejected.
media_libraries:
  default:
    config:
      max_file_size: 1048576
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  - name: "sponsors"
    label: "Sponsors"
    folder: "src/content/sponsors"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Sponsor name", name: "name", widget: "string" }
      - { label: "Logo", name: "logo", widget: "image" }
      - label: "Tier"
        name: "tier"
        widget: "select"
        options: ["platinum", "gold", "silver"]
      - { label: "Website URL", name: "url", widget: "string" }
      - { label: "Sponsorship start date", name: "startDate", widget: "datetime" }
      - { label: "Sponsorship end date", name: "endDate", widget: "datetime" }

  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Registration URL", name: "registrationUrl", widget: "string", required: false }
      - { label: "Featured", name: "isFeatured", widget: "boolean", default: false }

  - name: "gallery"
    label: "Gallery"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Photographer (member name)", name: "photographer", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["helping-hands", "hospital-care", "tributes", "workshops"]
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Year", name: "year", widget: "number", value_type: "int" }

  - name: "pages"
    label: "Pages"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "hero_slides"
    label: "Homepage Hero Slides"
    folder: "src/content/hero-slides"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Eyebrow label", name: "eyebrow", widget: "string", hint: "Small label above the headline" }
      - { label: "Headline", name: "headline", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Order", name: "order", widget: "number", value_type: "int", hint: "Slides display lowest-to-highest" }

  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Cover image", name: "coverImage", widget: "image" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Short summary shown on the blog list and in search results" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "press"
    label: "Press / In the Media"
    folder: "src/content/press"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Headline", name: "title", widget: "string" }
      - { label: "Publication", name: "publication", widget: "string", hint: "e.g. Star of Mysore" }
      - { label: "Published on", name: "date", widget: "datetime" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image" }
      - { label: "Article URL", name: "url", widget: "string", hint: "Link to the article on the publisher's site" }

  - name: "testimonials"
    label: "Member Testimonials"
    folder: "src/content/testimonials"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Member name", name: "memberName", widget: "string" }
      - { label: "Role", name: "role", widget: "string", hint: "e.g. Wedding photographer, 12 yrs" }
      - { label: "Quote", name: "quote", widget: "text" }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Order", name: "order", widget: "number", value_type: "int" }

  - name: "board"
    label: "Board of Directors"
    folder: "src/content/board"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Designation", name: "designation", widget: "string" }
      - label: "Tier"
        name: "tier"
        widget: "number"
        value_type: "int"
        hint: "1 = Honorary President, 2 = President, 3 = office bearers, 4 = directors"
      - { label: "Order within tier", name: "order", widget: "number", value_type: "int" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Note", name: "note", widget: "string", required: false, hint: "e.g. Former MLA, K.R. Constituency" }
      - { label: "Term", name: "term", widget: "string", hint: "Display label, e.g. 2025-27" }
      - label: "Term start year"
        name: "termStartYear"
        widget: "number"
        value_type: "int"
        hint: "The term with the highest start year is automatically shown as the current board on /board — no other flag needed. e.g. 2025"
      - label: "Homepage welcome message"
        name: "homeMessage"
        widget: "text"
        required: false
        hint: "Only Honorary President / President need this — shown in the homepage note section. Leave blank for everyone else."
      - label: "Cutout photo (transparent, no background)"
        name: "cutoutPhoto"
        widget: "image"
        required: false
        hint: "A background-removed portrait for the homepage note section. Leave blank to skip that person there."
