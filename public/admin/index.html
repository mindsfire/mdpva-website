<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>MDPVA CMS</title>
    <script>
      // Sveltia sets document.title to "Sveltia CMS" at runtime, so we re-assert
      // our title (and favicon) whenever the <head> changes.
      const TITLE = "MDPVA CMS";
      function brand() {
        if (document.title !== TITLE) document.title = TITLE;
        let icon = document.querySelector('link[rel="icon"]');
        if (!icon) {
          icon = document.createElement("link");
          icon.rel = "icon";
          document.head.appendChild(icon);
        }
        if (icon.getAttribute("href") !== "/icon.png") {
          icon.type = "image/png";
          icon.href = "/icon.png";
        }
      }
      brand();
      new MutationObserver(brand).observe(document.head, {
        childList: true,
        subtree: true,
        characterData: true,
      });

      // The "Sveltia CMS" product name is hardcoded into the bundle's UI
      // strings (sign-in heading, welcome message, etc.) with no config
      // override, so relabel it in the DOM wherever it appears as text.
      // document.body doesn't exist yet while this head script runs, so wait
      // for it before attaching the observer.
      function relabelBody() {
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        let node;
        while ((node = walker.nextNode())) {
          if (node.nodeValue.includes("Sveltia CMS")) {
            node.nodeValue = node.nodeValue.replaceAll("Sveltia CMS", "MDPVA CMS");
          }
        }
      }
      document.addEventListener("DOMContentLoaded", () => {
        relabelBody();
        new MutationObserver(relabelBody).observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true,
        });
      });
    </script>
  </head>
  <body>
    <!-- Sveltia CMS — a modern, Decap-compatible Git-based editor.
         Reads config.yml in this folder; writes Markdown to the repo. -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
  </body>
</html>
